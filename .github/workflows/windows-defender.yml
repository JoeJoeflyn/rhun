name: windows-defender

on:
  push:
    branches: ['feat/windows-defender*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        helper: [official, encoded, no-ai, no-updater, none, plain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original release
        if: matrix.helper == 'official'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          gh release download v0.16.6 --repo vshvedov/rhun --pattern rhun-0.16.6-windows-x86_64.zip --dir build/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = 'build/windows/rhun-0.16.6-windows-x86_64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ine 'ca772914f7116fb4f6b469b301559616c6aa204aab656d00bab349d0949d4c5c') { throw 'Official ZIP hash mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/original
          Copy-Item build/original/rhun-0.16.6/rhun.exe,build/original/rhun-0.16.6/rhun.com build/windows
      - uses: actions/cache/restore@v4
        if: matrix.helper != 'official'
        with:
          path: build/llvm
          key: llvm-windows-x64-23.1.2
      - name: LLVM
        if: matrix.helper != 'official'
        shell: pwsh
        timeout-minutes: 20
        run: tools/setup-windows-llvm.ps1
      - name: Diagnostic build
        if: matrix.helper != 'official'
        env:
          RHUN_DIST: '1'
        run: python tools/build-windows.py release --helper-mode ${{ matrix.helper }}
      - name: Package
        if: matrix.helper != 'official'
        run: python tools/package-windows.py
      - name: Compare repeat build
        if: matrix.helper != 'official'
        shell: pwsh
        env:
          RHUN_DIST: '1'
        run: |
          $hashes = Get-FileHash build/windows/rhun.exe,build/windows/rhun.com -Algorithm SHA256
          python tools/build-windows.py release --helper-mode ${{ matrix.helper }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in $hashes) {
            if ((Get-FileHash $file.Path -Algorithm SHA256).Hash -ne $file.Hash) { throw "Build is not reproducible: $($file.Path)" }
          }
      - name: Defender comparison
        shell: pwsh
        timeout-minutes: 10
        run: |
          tests/windows-defender.ps1
          $archive = (Get-ChildItem build/windows/rhun-*-windows-x86_64.zip).FullName
          tools/scan-windows.ps1 -Path @('build/windows/rhun.exe', 'build/windows/rhun.com', $archive) -ConfigureRunner -ReportOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defender-${{ matrix.helper }}
          path: build/defender
          if-no-files-found: error
